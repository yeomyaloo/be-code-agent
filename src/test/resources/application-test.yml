# 테스트 전용 설정 (build.gradle 의 test 태스크가 test 프로필을 켠다).
# 개발 DB 를 더럽히지 않도록 같은 DB 의 codeagent_test 스키마를 쓴다. 스키마는 Flyway 가 만든다.
# 다른 DB 를 쓰려면 환경 변수 TEST_DB_URL 로 바꾼다 (예: jdbc:postgresql://localhost:5432/codeagent_test)
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/codeagent?currentSchema=codeagent_test}
  flyway:
    schemas: codeagent_test
    create-schemas: true
    # 테스트를 시작할 때 스키마를 비우고 다시 만든다 (TestDatabaseConfig)
    clean-disabled: false
