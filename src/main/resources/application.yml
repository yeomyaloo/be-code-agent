spring:
  application:
    name: code-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeagent}
    username: ${DB_USERNAME:codeagent}
    password: ${DB_PASSWORD:codeagent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
