spring:
  application:
    name: code-agent
  config:
    # 개인 비밀 값(API 키, DB 비밀번호)은 git에 안 올라가는 application-local.yml 에 둔다
    import: optional:classpath:application-local.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeagent}
    username: ${DB_USERNAME:codeagent}
    password: ${DB_PASSWORD:codeagent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

codeagent:
  llm:
    # application-local.yml 또는 환경 변수 ANTHROPIC_API_KEY 로 채운다
    api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 16000
    # 안전 분류기가 거절하면 서버가 다른 모델로 자동 재시도 (server-side fallback)
    fallbacks: true
    worker:
      model: claude-sonnet-5-5
      effort: medium
    planner:
      model: claude-opus-5-5
      effort: high
    verifier:
      model: claude-opus-5-5
      effort: high
  agent:
    max-steps: 40
  workspace:
    # Git 주소로 등록한 저장소를 클론하는 곳
    dir: ${CODEAGENT_WORKSPACE:./workspace}
    # 클론을 허용하는 호스트 (https만). 내부망 접근(SSRF)을 막기 위해 목록에 있는 곳만 받는다
    allowed-hosts: github.com, gitlab.com, bitbucket.org
    max-size-mb: 500
    timeout-seconds: 60
    # 서버 디스크의 폴더 경로로 등록 허용. 여러 사람이 쓰는 서버면 false 로
    allow-local-path: ${CODEAGENT_ALLOW_LOCAL_PATH:true}
