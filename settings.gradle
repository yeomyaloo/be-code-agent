plugins {
	// JDK 21이 없으면 Gradle이 자동으로 받아옴
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'code-agent'

// 공용 코드 그래프 엔진(core-code-agent)을 소스로 바로 쓰려면 -PcoreCodeAgentDir=../core-code-agent
// (또는 gradle.properties 에 같은 값). 없으면 GitHub Packages 에 배포된 버전을 받는다.
def coreCodeAgentDir = providers.gradleProperty('coreCodeAgentDir').orNull
if (coreCodeAgentDir) {
	includeBuild(coreCodeAgentDir)
}
