# 푸시·PR 마다 전체 테스트를 돈다. DB 가 필요한 테스트를 위해 PostgreSQL 을 띄운다 (API 키는 필요 없음)
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 공용 엔진 core-code-agent 를 GitHub Packages 에서 받는다
permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: codeagent
          POSTGRES_USER: codeagent
          POSTGRES_PASSWORD: codeagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (벤치마크 위험 지점 검사 BenchmarkSinkTest 포함)
        run: ./gradlew test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 벤치마크 채점 스크립트 테스트
        run: python3 -m unittest discover -s benchmark -v

      - name: 테스트 결과 보관
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/reports/tests/test
